<title>Anatomi Lab Blok 1–9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: lab-report clinical notebook — sticky nav, single reading column for modules, two-pane tools for simulators */
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --sunk:#EDE8E0; --ink:#1E1915; --muted:#6A5F55; --line:#E0D8CC;
  --accent:#A3322A; --accent-ink:#FFFFFF; --accent-soft:#F7E6E2; --eosin:#C2410C;
  --ok:#1C7448; --ok-soft:#E2F2E9; --bad:#B0222E; --bad-soft:#FBE5E7; --warn:#8F5A00; --warn-soft:#FBF0D9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120F; --surface:#1E1A16; --sunk:#2A241F; --ink:#EEE7DF; --muted:#A99D90; --line:#3A322B;
  --accent:#F08A7E; --accent-ink:#2A0F0B; --accent-soft:#3A1F1B; --eosin:#FB923C;
  --ok:#62D39C; --ok-soft:#14301F; --bad:#FF8B94; --bad-soft:#3B1A20; --warn:#F1C267; --warn-soft:#3A2E13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120F; --surface:#1E1A16; --sunk:#2A241F; --ink:#EEE7DF; --muted:#A99D90; --line:#3A322B;
  --accent:#F08A7E; --accent-ink:#2A0F0B; --accent-soft:#3A1F1B; --eosin:#FB923C;
  --ok:#62D39C; --ok-soft:#14301F; --bad:#FF8B94; --bad-soft:#3B1A20; --warn:#F1C267; --warn-soft:#3A2E13; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
h4{font-family:var(--f-display);font-size:1.02rem;margin:1.4em 0 .4em;font-weight:700}
p{margin:.45em 0}
a{color:var(--accent)}
.eyebrow{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{font:800 1.12rem var(--f-display)}
.brand span{font:500 .7rem var(--f-mono);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;font-size:.92rem}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (max-width:720px){.top .wrap{flex-wrap:wrap;gap:4px;padding-block:8px}.nav{margin-left:0;width:100%}}

main{padding-block:28px 64px}
.section{margin-top:34px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);cursor:pointer;font-size:.88rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{font-family:var(--f-mono);opacity:.75}
.tag{font:500 .7rem var(--f-mono);letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.c34{background:var(--accent-soft);color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero p.lead{font-size:1.08rem;max-width:58ch;color:var(--muted)}
.count{border-left:3px solid var(--eosin);padding:4px 0 4px 16px}
.count .num{font:800 3rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats>div{background:var(--surface);padding:14px 16px}
.stats b{display:block;font:700 1.5rem var(--f-display);font-variant-numeric:tabular-nums}

/* tables */
.tblwrap{overflow-x:auto;margin:.6em 0}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem;margin:.6em 0}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:600 .74rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.lab td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{font:600 .72rem var(--f-mono);padding:1px 6px;border-radius:4px}
.flag.H{background:var(--bad-soft);color:var(--bad)}
.flag.L{background:var(--warn-soft);color:var(--warn)}
.flag.N{background:var(--ok-soft);color:var(--ok)}

/* module */
.prose{max-width:74ch}
.prose ul,.prose ol{padding-left:1.25em;margin:.4em 0}
.prose li{margin:.25em 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:.7em 0}
.flow span{background:var(--sunk);border-radius:6px;padding:6px 10px;font-size:.9rem;position:relative}
.flow span:not(:last-child)::after{content:"→";color:var(--accent);margin-left:8px;font-weight:700}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:.8em 0;overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin:.6em 0}
.bridge{border:1px dashed var(--accent);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.bridge p{margin:.5em 0}
ol.steps{counter-reset:s;list-style:none;padding-left:0}
ol.steps>li{counter-increment:s;padding-left:2.1em;position:relative;margin:.55em 0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:.05em;width:1.5em;height:1.5em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 .8rem/1.5em var(--f-mono);text-align:center}
.callout{border-radius:var(--r);padding:14px 16px}
.callout.hi{background:var(--ok-soft)}
.callout.trap{background:var(--bad-soft)}
.callout.mn{background:var(--warn-soft)}
.callout h3{font-size:1rem;margin-bottom:6px}
.modcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.modcard:hover{border-color:var(--accent)}
.modcard .no{font:600 .78rem var(--f-mono);color:var(--accent)}
.modcard .done{color:var(--ok);font:600 .75rem var(--f-mono)}
.bc{font-size:.88rem;color:var(--muted)}
.bc a{color:var(--muted)}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.qstem{font-size:1.04rem;font-weight:500;margin:.4em 0 1em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:600 .85rem var(--f-mono);color:var(--muted);min-width:1.2em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--sunk);font-size:.94rem}
.expl b.ok{color:var(--ok)} .expl b.no{color:var(--bad)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* exam */
.examtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
@media (max-width:720px){.examtop{top:calc(env(safe-area-inset-top,0px) + 92px)}}
.timer{font:600 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.navgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font:500 .8rem var(--f-mono);cursor:pointer}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--accent)}
.navgrid button.flg{box-shadow:inset 0 -3px 0 var(--eosin)}
.navgrid button.r-ok{background:var(--ok-soft);border-color:var(--ok)}
.navgrid button.r-no{background:var(--bad-soft);border-color:var(--bad)}
.examlayout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;margin-top:16px}
@media (max-width:860px){.examlayout{grid-template-columns:1fr}}
.score{font:800 3.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tbar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.9rem;margin:6px 0}
.tbar .mono{text-align:right}

/* sim */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.simgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px}
@media (max-width:860px){.simgrid{grid-template-columns:1fr}}
.ctrl{display:grid;gap:12px}
.ctrl label{display:grid;gap:4px;font-size:.9rem}
.ctrl label .row{justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],select,textarea,input[type=text]{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface);width:100%}
canvas{width:100%;display:block;border-radius:8px;background:var(--sunk)}
.vbar{height:30px;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden}
.vbar>i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.vbar>em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.log{font:400 .82rem var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.log span{background:var(--sunk);border-radius:4px;padding:2px 7px}
.thermo{position:relative;height:300px;width:64px;border-radius:32px;background:linear-gradient(to top,var(--accent-soft),var(--bad-soft));border:1px solid var(--line);flex:none}
.thermo .mk{position:absolute;left:-6px;right:-6px;height:3px;border-radius:2px;transition:bottom .6s}
.thermo .mk.sp{background:var(--accent)}
.thermo .mk.core{background:var(--eosin);height:5px}
.scale{position:relative;height:300px;width:44px;font:500 .72rem var(--f-mono);color:var(--muted)}
.scale span{position:absolute;right:0;transform:translateY(50%)}
.lane{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.fx{font:600 .82rem var(--f-mono);padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.fx.off{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fb.s0,.fb.s1,.fb.s2{font-size:.94rem}
.timer.low{color:var(--bad)}
.res{border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0}

/* roleplay */
.rpcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.rpcard:hover{border-color:var(--accent)}
.bubble{border-radius:12px;padding:12px 14px;max-width:62ch;white-space:pre-wrap}
.bubble.them{background:var(--sunk);border-top-left-radius:3px}
.bubble.me{background:var(--accent-soft);margin-left:auto;border-top-right-radius:3px}
.who{font:500 .74rem var(--f-mono);color:var(--muted);margin-bottom:3px;letter-spacing:.03em}
.chat{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto;padding:4px}
.jstep{border-left:2px solid var(--line);padding:2px 0 14px 18px;position:relative}
.jstep::before{content:attr(data-n);position:absolute;left:-13px;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 .75rem/24px var(--f-mono);text-align:center}
.jstep textarea{min-height:76px;margin:6px 0}
.model{background:var(--ok-soft);border-radius:8px;padding:12px 14px;margin-top:6px}
.concept{display:flex;flex-direction:column;gap:4px}
.concept span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.concept span:not(:last-child)::after{content:"↓";display:block;color:var(--accent);font-weight:700;line-height:1;margin-top:4px}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px}
.fb.s2{background:var(--ok-soft)} .fb.s1{background:var(--warn-soft)} .fb.s0{background:var(--bad-soft)}
.note{font-size:.86rem;color:var(--muted)}
/* CBT */
body.cbt-on .top{display:none}
body.cbt-on main{padding-block:0 40px}
.cbt-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border-bottom:2px solid var(--accent);padding:10px 0;margin-bottom:16px}
.cbt-id{display:flex;flex-direction:column;align-items:center}
.cbt-clock{display:flex;flex-direction:column;align-items:flex-end}
.cbt-body{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
@media (max-width:860px){.cbt-body{grid-template-columns:1fr}}
.cbt-q{font-size:calc(1rem * var(--cfs,1))}
.cbt-stem{font-size:calc(1.08rem * var(--cfs,1));line-height:1.65;margin:14px 0 18px;max-width:72ch}
.cbt-q .opt{font-size:calc(.98rem * var(--cfs,1));padding:12px 14px}
.cbt-side{display:grid;gap:12px;align-content:start}
.cbt-tools{display:flex;flex-wrap:wrap;gap:6px}
.cbt-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.8rem;color:var(--muted)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--surface);vertical-align:-1px;margin-right:4px}
.lg.a{background:var(--ok-soft);border-color:var(--ok)}.lg.f{background:var(--warn-soft);border-color:var(--warn)}
.navgrid button.ans{background:var(--ok-soft);border-color:var(--ok)}
.navgrid button.flg2{background:var(--warn-soft);border-color:var(--warn)}
.cbt-flag{background:var(--warn-soft);border-radius:6px;padding:4px 10px;cursor:pointer}
.cbt-modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ctrl label.row{display:flex;align-items:center}
.examlayout.osce{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:860px){.examlayout.osce{grid-template-columns:1fr}.examlayout.osce>aside{order:-1}}
.cbt-modal[hidden],.cbt-toast[hidden],[hidden]{display:none!important}
/* Model 3D */
:root{--v3a:#ffffff;--v3b:#e4ded3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--v3a:#3a3f4d;--v3b:#171a22}}
:root[data-theme="dark"]{--v3a:#3a3f4d;--v3b:#171a22}
.v3d{padding:14px;display:grid;gap:10px;min-width:0}
.v3hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.v3tools{display:flex;flex-wrap:wrap;gap:6px}
.v3stage{position:relative;border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,var(--v3a),var(--v3b));min-height:260px}
.v3stage canvas{display:block;touch-action:none;cursor:grab}
.v3stage canvas:active{cursor:grabbing}
.v3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.v3lbl{position:absolute;left:0;top:0;pointer-events:auto;font:600 11px/1.2 var(--f-body,system-ui);background:rgba(255,255,255,.93);color:#1b1f2a;border:1px solid rgba(0,0,0,.14);border-radius:999px;padding:3px 8px;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.v3lbl.on{background:#f5a524;border-color:#c77d00}
.v3hint{position:absolute;left:8px;bottom:6px;right:8px;margin:0;font-size:.72rem;color:#4b5160;pointer-events:none;text-shadow:0 0 4px #fff}
.v3load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}
.v3ctl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.v3ctl:empty{display:none}
.v3grp{display:grid;gap:4px}
.v3read{font-size:.82rem;background:var(--sunk);border-radius:8px;padding:8px 10px;flex-basis:100%}
.v3info{font-size:.9rem;border-left:3px solid var(--accent);padding:4px 10px}
.v3d:fullscreen{background:var(--bg);overflow:auto;border-radius:0}
@media (max-width:560px){.v3hint{display:none}.v3lbl{font-size:10px;padding:2px 6px}}

.cbt-mbox{width:min(620px,100%);max-height:85vh;overflow:auto}
.cbt-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px)}

/* Anatomi Lab */
.atlascard{display:flex;flex-direction:column;align-items:center}
svg.atlas{width:100%;max-width:600px;max-height:72vh;display:block;background:#efe9df;border-radius:8px}
.pin{cursor:pointer}.pin:focus{outline:none}.pin:focus-visible circle{stroke:var(--accent);stroke-width:3}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.25}}
.pinlist{columns:2;column-gap:16px;padding-left:1.4em;margin:0;font-size:.88rem}
@media (max-width:500px){.pinlist{columns:1}}
.linkbtn{background:none;border:0;padding:1px 0;cursor:pointer;color:var(--ink);text-align:left}
.linkbtn:hover,.linkbtn.on{color:var(--accent);font-weight:600}
.target{font:700 1.25rem var(--f-display);color:var(--accent);margin:.2em 0 .6em}
.blokmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;margin-top:14px}
.blokcol{display:flex;flex-direction:column;gap:6px;padding:14px}
.blokcol h3{font-size:1rem}
.bnum{font:800 1.9rem/1 var(--f-display);color:var(--accent)}
.bbar{height:4px;background:var(--sunk);border-radius:3px;overflow:hidden}.bbar i{display:block;height:100%;background:var(--ok)}
.bmod{font-size:.9rem;text-decoration:none;color:var(--ink);padding:3px 0;border-bottom:1px dashed var(--line)}
.bmod:hover{color:var(--accent)}
.seqdone{margin:0;padding-left:1.6em;display:grid;gap:4px}
.seqdone li{background:var(--ok-soft);border-radius:6px;padding:5px 10px}
.seqpile{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.seqcard,.pcard{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font-size:.92rem}
.seqcard:hover,.pcard:hover:not([disabled]){border-color:var(--accent)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairgrid>div{display:grid;gap:8px;align-content:start;min-width:0}
.pcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.pcard.ok{background:var(--ok-soft);border-color:var(--ok);opacity:.75}
.shake{animation:shake .35s;border-color:var(--bad)!important;background:var(--bad-soft)!important}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:min(520px,100%);min-height:220px;margin:0 auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;padding:24px;text-align:center}
.flash b{font:700 1.7rem/1.2 var(--f-display)}
.flash.on{background:var(--accent-soft);border-color:var(--accent)}
input[type=search],input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.ctrl{align-content:start}.ctrl .tabs{align-items:center}
@media (max-width:860px){.simgrid>.atlascard{order:-1}}
.pind summary{cursor:pointer;font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
